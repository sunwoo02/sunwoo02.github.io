<header class="site-header">
  <div class="container nav-container">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
    <label for="nav-toggle" class="nav-toggle-label">Menu</label>

    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.75"></circle>
        <path d="M12 2.5v2.25M12 19.25V21.5M4.57 4.57l1.59 1.59M17.84 17.84l1.59 1.59M2.5 12h2.25M19.25 12h2.25M4.57 19.43l1.59-1.59M17.84 6.16l1.59-1.59"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
      </svg>
    </button>

    <nav class="site-nav" aria-label="Primary">
      {% include nav.html %}
    </nav>
  </div>
</header>
